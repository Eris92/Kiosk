<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Zgłoś problem</title>
<style>body{font-family:"Segoe UI",sans-serif;background:#0d1423;color:#f0f5fc;max-width:760px;margin:48px auto;padding:0 24px}
h1{font-weight:600}label{display:block;margin:16px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;background:#18233a;color:#f0f5fc;border:1px solid #2c3c51;border-radius:10px;padding:10px 12px;font:inherit}
textarea{min-height:140px}button{margin-top:20px;background:#3ddc84;color:#0d1423;border:0;border-radius:20px;padding:10px 28px;font:600 15px "Segoe UI",sans-serif;cursor:pointer}
.done{display:none;background:#18233a;border:1px solid #3ddc84;border-radius:16px;padding:20px 24px;margin-top:24px}</style></head>
<body><h1>Zgłoś problem</h1>
<form id="f">
<label for="k">Czego dotyczy?</label>
<select id="k"><option>Komputer / Kiosk</option><option>Karta lub logowanie</option><option>Aplikacja</option><option>Drukarka</option><option>Inne</option></select>
<label for="o">Opis problemu</label><textarea id="o" required placeholder="Co się stało i kiedy?"></textarea>
<button type="submit">Wyślij zgłoszenie</button></form>
<div class="done" id="d"><b>Dziękujemy!</b> To jest przykładowy formularz (config\news). Podłącz tu swój system zgłoszeń, np. podaj w Action adres formularza helpdesku.</div>
<script>document.getElementById('f').onsubmit=function(e){e.preventDefault();this.style.display='none';document.getElementById('d').style.display='block';};</script>
</body></html>
