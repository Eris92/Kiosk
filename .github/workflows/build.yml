name: Build Windows client
on:
  push:
    # The test branch too: Konfiguracja → Aktualizacja (Ctrl+Alt+U) on the test PCs gets every pushed version.
    branches: [main, kiosk-explorer, claude/project-thread-gr3tx0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  # Release tag; the client shows it in Konfiguracja → Aktualizacja and updates only to a newer build-N.
  KIOSK_VERSION: ${{ format('build-{0}', github.run_number) }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate PowerShell syntax and JSON
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          Get-ChildItem config/*.json | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json | Out-Null }
      - name: Publish client
        shell: pwsh
        run: ./scripts/Build.ps1 -Version $env:KIOSK_VERSION
      - name: Windows embedded UI smoke test
        shell: pwsh
        run: |
          $process = Start-Process ./out/client/Kiosk.Client.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out.' }
          Get-Content ./out/client/self-test.txt
          if ($process.ExitCode -ne 0) { throw 'Windows embedded UI smoke test failed.' }
      - uses: actions/upload-artifact@v4
        # The account's artifact storage can be full; the release below carries the package anyway.
        continue-on-error: true
        with:
          name: settings-screenshots
          path: out/screenshots/
          retention-days: 7
      # Same layout as the repository, so scripts\Install-*.ps1 find out\client and config\ without parameters.
      - name: Package
        shell: pwsh
        run: |
          Remove-Item out/client/self-test* -ErrorAction SilentlyContinue
          $package = 'package/Kiosk'
          New-Item -ItemType Directory -Path "$package/out" -Force | Out-Null
          Copy-Item out/client "$package/out/client" -Recurse
          Copy-Item scripts "$package/scripts" -Recurse
          Copy-Item config "$package/config" -Recurse
          # Only what a kiosk PC needs: the example messages are already in out/client/news-example; building,
          # the video generators and the Session Host launcher (apps.json) belong to the repository, not to the PC.
          Remove-Item "$package/config/news", "$package/config/apps.json", "$package/scripts/tools", "$package/scripts/Build.ps1",
            "$package/scripts/Start-SessionLauncher.ps1" -Recurse
          Copy-Item README.md "$package/README.md"
          Get-ChildItem package -Recurse -Filter '*.local.json' | Remove-Item
          Compress-Archive -Path "$package/*" -DestinationPath package/Kiosk-win-x64.zip
      - uses: actions/upload-artifact@v4
        # The account's artifact storage can be full; the release below carries the package anyway.
        continue-on-error: true
        with:
          name: Kiosk-win-x64
          path: package/Kiosk/
          retention-days: 30
      - name: Publish settings pictures
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path out/screenshots/* -DestinationPath out/settings-screenshots.zip -Force
          gh release view ci-screenshots *> $null
          if ($LASTEXITCODE -ne 0) { gh release create ci-screenshots --prerelease --title 'CI: settings pictures' --notes 'Pictures of Konfiguracja from the latest CI build (not a Kiosk version).' }
          gh release upload ci-screenshots out/settings-screenshots.zip --clobber
      # Installed Kiosks install only a package signed with this key (its public half is in Updater.cs).
      - name: Sign package
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          KIOSK_SIGNING_KEY: ${{ secrets.KIOSK_SIGNING_KEY }}
        run: |
          if (-not $env:KIOSK_SIGNING_KEY) { Write-Warning 'KIOSK_SIGNING_KEY is not set: this package is unsigned and installed Kiosks will not install it.'; exit 0 }
          $der = [Convert]::FromBase64String(($env:KIOSK_SIGNING_KEY -replace '-----[^-]+-----', '' -replace '\s', ''))
          $key = [System.Security.Cryptography.ECDsaCng]::new([System.Security.Cryptography.CngKey]::Import($der, [System.Security.Cryptography.CngKeyBlobFormat]::Pkcs8PrivateBlob))
          $hash = (Get-FileHash package/Kiosk-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $data = [Text.Encoding]::UTF8.GetBytes("$env:KIOSK_VERSION`n$hash")
          $signature = $key.SignData($data, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          [Convert]::ToBase64String($signature) | Set-Content package/Kiosk-win-x64.zip.sig -NoNewline -Encoding ascii
          Write-Output "Signed $env:KIOSK_VERSION ($hash)"
      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:KIOSK_VERSION
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $notes = "Branch/tag: ${{ github.ref_name }}, commit $sha.`n`nInstall: unzip to e.g. C:\Kiosk, then run as administrator scripts\Install-KioskShell.ps1 (see README)."
          $files = @('package/Kiosk-win-x64.zip') + @(Get-ChildItem package/Kiosk-win-x64.zip.sig -ErrorAction SilentlyContinue | ForEach-Object FullName)
          gh release create $tag @files --target '${{ github.sha }}' --title "Kiosk $tag (${{ github.ref_name }})" --notes $notes
