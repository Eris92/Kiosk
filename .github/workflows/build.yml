name: Build Windows client
on:
  push:
    branches: [main, kiosk-explorer]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  # Release tag; the client shows it in Konfiguracja → Aktualizacja and compares it with the latest release.
  KIOSK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate PowerShell syntax and JSON
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          Get-ChildItem config/*.json | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json | Out-Null }
      - name: Publish client
        shell: pwsh
        run: ./scripts/Build.ps1 -Version $env:KIOSK_VERSION
      - name: Windows embedded UI smoke test
        shell: pwsh
        run: |
          $process = Start-Process ./out/client/Kiosk.Client.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out.' }
          Get-Content ./out/client/self-test.txt
          if ($process.ExitCode -ne 0) { throw 'Windows embedded UI smoke test failed.' }
      # Same layout as the repository, so scripts\Install-*.ps1 find out\client and config\ without parameters.
      - name: Package
        shell: pwsh
        run: |
          Remove-Item out/client/self-test* -ErrorAction SilentlyContinue
          $package = 'package/Kiosk'
          New-Item -ItemType Directory -Path "$package/out" -Force | Out-Null
          Copy-Item out/client "$package/out/client" -Recurse
          Copy-Item scripts "$package/scripts" -Recurse
          Copy-Item config "$package/config" -Recurse
          Copy-Item README.md "$package/README.md"
          Get-ChildItem package -Recurse -Filter '*.local.json' | Remove-Item
          Compress-Archive -Path "$package/*" -DestinationPath package/Kiosk-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kiosk-win-x64
          path: package/Kiosk/
          retention-days: 30
      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:KIOSK_VERSION
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $notes = "Branch/tag: ${{ github.ref_name }}, commit $sha.`n`nInstall: unzip to e.g. C:\Kiosk, then run as administrator scripts\Install-KioskShell.ps1 (see README)."
          gh release create $tag package/Kiosk-win-x64.zip --target '${{ github.sha }}' --title "Kiosk $tag (${{ github.ref_name }})" --notes $notes
