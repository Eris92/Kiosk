name: Build Windows client
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kiosk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
      - name: Audit locked NuGet dependencies
        shell: pwsh
        run: |
          $projects = @(
            'src/Kiosk.Client/Kiosk.Client.csproj',
            'src/Kiosk.ConfigTool/KioskKonfiguracje.csproj',
            'src/Kiosk.NewsEditor/KioskKomunikaty.csproj',
            'src/Kiosk.FidoBroker/FidoRun.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905
            if ($LASTEXITCODE -ne 0) { throw "NuGet audit failed: $project" }
          }
      - name: Validate scripts and run separate embedded UI self-tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build client, native credential provider and clean deployment candidate
        shell: pwsh
        run: ./scripts/New-Package.ps1
      - name: Verify deployment candidate inventory, safe configuration and hashes
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -PackagePath ./out/package
      - name: Upload unsigned deployment candidate
        uses: actions/upload-artifact@v7
        with:
          name: Kiosk-win-x64-candidate
          path: out/package/
          if-no-files-found: error
          retention-days: 30
      - name: Upload self-test diagnostics separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kiosk-self-test-results
          path: out/self-test/self-test*.txt
          if-no-files-found: ignore
          retention-days: 14
