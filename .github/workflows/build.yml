name: Build Windows client
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  # The client shows this in Konfiguracja → Aktualizacja and updates only to a newer build-N.
  KIOSK_VERSION: ${{ format('build-{0}', github.run_number) }}
concurrency:
  group: kiosk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
      - name: Audit locked NuGet dependencies
        shell: pwsh
        run: |
          $projects = @(
            'src/Kiosk.Client/Kiosk.Client.csproj',
            'src/Kiosk.ConfigTool/KioskKonfiguracje.csproj',
            'src/Kiosk.NewsEditor/KioskKomunikaty.csproj',
            'src/Kiosk.FidoBroker/FidoRun.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905
            if ($LASTEXITCODE -ne 0) { throw "NuGet audit failed: $project" }
          }
      - name: Validate scripts and run separate embedded UI self-tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build client, native credential provider and clean deployment candidate
        shell: pwsh
        env:
          InformationalVersion: ${{ env.KIOSK_VERSION }}
          IncludeSourceRevisionInInformationalVersion: false
        run: ./scripts/New-Package.ps1
      - name: Verify deployment candidate inventory, safe configuration and hashes
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -PackagePath ./out/package
      - name: Upload unsigned deployment candidate
        uses: actions/upload-artifact@v7
        with:
          name: Kiosk-win-x64-candidate
          path: out/package/
          if-no-files-found: error
          # ~53 MB per build on every push/PR; 30 days exhausted the account-wide
          # Actions artifact quota and broke uploads in other repositories.
          retention-days: 5
      - name: Upload self-test diagnostics separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kiosk-self-test-results
          path: out/self-test/self-test*.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Sign update package
        if: github.event_name != 'pull_request' && github.actor == github.repository_owner
        shell: pwsh
        env:
          KIOSK_SIGNING_KEY: ${{ secrets.KIOSK_SIGNING_KEY }}
        run: |
          # A package installed Kiosks would refuse is never published.
          if (-not $env:KIOSK_SIGNING_KEY) { throw 'KIOSK_SIGNING_KEY is not set: installed Kiosks would refuse an unsigned package.' }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path out/package/* -DestinationPath release/Kiosk-win-x64.zip
          $der = [Convert]::FromBase64String(($env:KIOSK_SIGNING_KEY -replace '-----[^-]+-----', '' -replace '\s', ''))
          $key = [System.Security.Cryptography.ECDsaCng]::new([System.Security.Cryptography.CngKey]::Import($der, [System.Security.Cryptography.CngKeyBlobFormat]::Pkcs8PrivateBlob))
          $hash = (Get-FileHash release/Kiosk-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $data = [Text.Encoding]::UTF8.GetBytes("$env:KIOSK_VERSION`n$hash")
          $signature = $key.SignData($data, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          $pem = [regex]::Match((Get-Content src/Kiosk.Client/Updater.cs -Raw), '-----BEGIN PUBLIC KEY-----[\s\S]+?-----END PUBLIC KEY-----').Value -replace '(?m)^[ \t]+', ''
          $public = [System.Security.Cryptography.ECDsa]::Create()
          $public.ImportFromPem($pem)
          if (-not $public.VerifyData($data, $signature, [System.Security.Cryptography.HashAlgorithmName]::SHA256)) { throw 'KIOSK_SIGNING_KEY does not match the public key in Updater.cs.' }
          [Convert]::ToBase64String($signature) | Set-Content release/Kiosk-win-x64.zip.sig -NoNewline -Encoding ascii
      - name: Publish update release
        if: github.event_name != 'pull_request' && github.actor == github.repository_owner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only main is "latest" (kanał main); other branches are pre-releases, which only kanał dev installs.
          $prerelease = @(if ('${{ github.ref_name }}' -ne 'main') { '--prerelease' })
          gh release create $env:KIOSK_VERSION release/Kiosk-win-x64.zip release/Kiosk-win-x64.zip.sig @prerelease --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Kiosk $env:KIOSK_VERSION (${{ github.ref_name }})" --notes "Commit ${{ github.sha }}."
